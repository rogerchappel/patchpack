name: Release dry run

on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/**
      - scripts/**
      - examples/**
      - README.md
      - CHANGELOG.md
      - CONTRIBUTING.md
      - LICENSE
      - SECURITY.md
      - tsconfig*.json
      - releasebox.config.json
      - package.json
      - package-lock.json
      - .github/workflows/release*.yml

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASEBOX_REF: v0.1.0

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install ReleaseBox
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$RELEASEBOX_REF" https://github.com/rogerchappel/releasebox.git /tmp/releasebox
          npm --prefix /tmp/releasebox ci
          npm --prefix /tmp/releasebox run build
      - name: ReleaseBox readiness check
        run: node /tmp/releasebox/bin/releasebox.js check .
      - name: Run release checks
        run: npm run release:check
      - name: Exercise release tag guard
        run: |
          GITHUB_REF_NAME="v$(node -p "require('./package.json').version")" node scripts/release-guard.mjs check-tag
          if GITHUB_REF_NAME=v999.0.0 node scripts/release-guard.mjs check-tag; then
            echo "tag mismatch unexpectedly passed" >&2
            exit 1
          fi
      - name: Exercise artifact guard
        run: |
          mkdir -p release-artifacts
          npm pack --pack-destination release-artifacts
          node scripts/release-guard.mjs artifact release-artifacts
          cp release-artifacts/*.tgz release-artifacts/duplicate.tgz
          if node scripts/release-guard.mjs artifact release-artifacts; then
            echo "multiple artifacts unexpectedly passed" >&2
            exit 1
          fi
          rm release-artifacts/duplicate.tgz
      - name: Release notes preview
        run: |
          node /tmp/releasebox/bin/releasebox.js notes . > release-notes-preview.md
          cat release-notes-preview.md
      - name: Publish release notes summary
        run: cat release-notes-preview.md >> "$GITHUB_STEP_SUMMARY"
